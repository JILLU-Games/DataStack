[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datastack"
version = "2.2.0"
description = "Official Python SDK for DataStack — Real-Time WebSocket & HTTP Fallback Telemetry Ingestion Engine with Auto Heartbeat Recovery, Offline Spooling, and Direct CSV/JSON File Streaming"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
  { name = "Md Anik (Vib Tools)", email = "info@vibtools.top" }
]
keywords = [
  "datastack",
  "telemetry",
  "event-ingestion",
  "websocket",
  "socketio",
  "csv-streaming",
  "offline-spool",
  "vib-tools"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring"
]
dependencies = [
  "python-socketio[client]>=5.8.0",
  "requests>=2.28.0",
  "websocket-client>=1.5.0"
]

[project.urls]
Homepage = "https://vibtools.top/"
Documentation = "https://github.com/anik-d-art/datastack"
Repository = "https://github.com/anik-d-art/datastack"
Issues = "https://github.com/anik-d-art/datastack/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["datastack*"]
